<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380">
  <rect width="780" height="380" fill="#ecfdf5" stroke="#e7e5e4"/>
  <text x="390" y="28" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-weight="700" fill="#292524">Благородный восьмеричный путь — три культуры</text>
  <g font-family="Source Sans 3, sans-serif" font-size="11">
    <rect x="40" y="50" width="220" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="150" y="72" text-anchor="middle" font-weight="700" fill="#1e40af">ПРАДЖНЯ — мудрость</text>
    <text x="150" y="90" text-anchor="middle" font-size="10" fill="#78716c">куда идти</text>

    <rect x="280" y="50" width="220" height="52" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="390" y="72" text-anchor="middle" font-weight="700" fill="#166534">ШИЛА — поведение</text>
    <text x="390" y="90" text-anchor="middle" font-size="10" fill="#78716c">как идти без вреда</text>

    <rect x="520" y="50" width="220" height="52" rx="10" fill="#fae8ff" stroke="#c026d3"/>
    <text x="630" y="72" text-anchor="middle" font-weight="700" fill="#86198f">САМАДХИ — медитация</text>
    <text x="630" y="90" text-anchor="middle" font-size="10" fill="#78716c">как удержаться на пути</text>

    <g>
      <rect x="40" y="120" width="220" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="150" y="140" text-anchor="middle" font-weight="700" fill="#1e3a8a">1. Правильное воззрение</text>
      <text x="150" y="158" text-anchor="middle" font-size="9" fill="#78716c">4 истины, непостоянство,</text>
      <text x="150" y="170" text-anchor="middle" font-size="9" fill="#78716c">отсутствие «я»</text>

      <rect x="40" y="190" width="220" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="150" y="210" text-anchor="middle" font-weight="700" fill="#1e3a8a">2. Правильное намерение</text>
      <text x="150" y="228" text-anchor="middle" font-size="9" fill="#78716c">отречение, доброжелательность,</text>
      <text x="150" y="240" text-anchor="middle" font-size="9" fill="#78716c">непричинение вреда</text>

      <rect x="280" y="120" width="220" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="390" y="140" text-anchor="middle" font-weight="700" fill="#14532d">3. Правильная речь</text>
      <text x="390" y="157" text-anchor="middle" font-size="9" fill="#78716c">без лжи, злословия, грубости, пустословия</text>

      <rect x="280" y="176" width="220" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="390" y="196" text-anchor="middle" font-weight="700" fill="#14532d">4. Правильное действие</text>
      <text x="390" y="213" text-anchor="middle" font-size="9" fill="#78716c">не вредить, не красть (ахимса)</text>

      <rect x="280" y="232" width="220" height="46" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="390" y="252" text-anchor="middle" font-weight="700" fill="#14532d">5. Правильный образ жизни</text>
      <text x="390" y="269" text-anchor="middle" font-size="9" fill="#78716c">честный заработок без вреда</text>

      <rect x="520" y="120" width="220" height="46" rx="8" fill="#fdf4ff" stroke="#e9a8f5"/>
      <text x="630" y="140" text-anchor="middle" font-weight="700" fill="#701a75">6. Правильное усилие</text>
      <text x="630" y="157" text-anchor="middle" font-size="9" fill="#78716c">отсекать неблагое, взращивать благо</text>

      <rect x="520" y="176" width="220" height="46" rx="8" fill="#fdf4ff" stroke="#e9a8f5"/>
      <text x="630" y="196" text-anchor="middle" font-weight="700" fill="#701a75">7. Правильное памятование</text>
      <text x="630" y="213" text-anchor="middle" font-size="9" fill="#78716c">осознанность (випассана)</text>

      <rect x="520" y="232" width="220" height="46" rx="8" fill="#fdf4ff" stroke="#e9a8f5"/>
      <text x="630" y="252" text-anchor="middle" font-weight="700" fill="#701a75">8. Правильное сосредоточение</text>
      <text x="630" y="269" text-anchor="middle" font-size="9" fill="#78716c">дхьяны, шаматха</text>
    </g>

    <line x1="150" y1="102" x2="150" y2="120" stroke="#86efac"/>
    <line x1="390" y1="102" x2="390" y2="120" stroke="#86efac"/>
    <line x1="630" y1="102" x2="630" y2="120" stroke="#86efac"/>

    <rect x="40" y="296" width="700" height="36" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="390" y="319" text-anchor="middle" font-size="11" fill="#57534e">Факторы развиваются одновременно и поддерживают друг друга, а не проходятся по очереди</text>
  </g>
</svg>
