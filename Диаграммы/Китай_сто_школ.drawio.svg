<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360">
  <rect width="780" height="360" fill="#fef2f2" stroke="#e7e5e4"/>
  <text x="390" y="28" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-weight="700" fill="#292524">Эпоха «ста школ»: шесть ответов на вопрос о порядке</text>
  <g font-family="Source Sans 3, sans-serif" font-size="11">
    <rect x="215" y="45" width="350" height="44" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="390" y="65" text-anchor="middle" font-weight="700" fill="#991b1b">Как восстановить порядок?</text>
    <text x="390" y="82" text-anchor="middle" font-size="10" fill="#78716c">эпохи Чуньцю и Чжаньго, VIII–III вв. до н. э.</text>

    <g>
      <rect x="20" y="120" width="115" height="120" rx="8" fill="#fff7ed" stroke="#f97316"/>
      <text x="77" y="140" text-anchor="middle" font-weight="700" fill="#9a3412">КОНФУ-</text>
      <text x="77" y="154" text-anchor="middle" font-weight="700" fill="#9a3412">ЦИАНСТВО</text>
      <text x="77" y="176" text-anchor="middle" font-size="9" fill="#78716c">добродетель,</text>
      <text x="77" y="188" text-anchor="middle" font-size="9" fill="#78716c">ритуал (ли),</text>
      <text x="77" y="200" text-anchor="middle" font-size="9" fill="#78716c">воспитание</text>
      <text x="77" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Конфуций</text>

      <rect x="145" y="120" width="115" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
      <text x="202" y="140" text-anchor="middle" font-weight="700" fill="#166534">ДАОСИЗМ</text>
      <text x="202" y="176" text-anchor="middle" font-size="9" fill="#78716c">Дао, у-вэй,</text>
      <text x="202" y="188" text-anchor="middle" font-size="9" fill="#78716c">естественность</text>
      <text x="202" y="200" text-anchor="middle" font-size="9" fill="#78716c">(цзы-жань)</text>
      <text x="202" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Лао-цзы</text>

      <rect x="270" y="120" width="115" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="327" y="140" text-anchor="middle" font-weight="700" fill="#1e40af">МОИЗМ</text>
      <text x="327" y="176" text-anchor="middle" font-size="9" fill="#78716c">всеобщая</text>
      <text x="327" y="188" text-anchor="middle" font-size="9" fill="#78716c">любовь,</text>
      <text x="327" y="200" text-anchor="middle" font-size="9" fill="#78716c">критерий пользы</text>
      <text x="327" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Мо-цзы</text>

      <rect x="395" y="120" width="115" height="120" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
      <text x="452" y="140" text-anchor="middle" font-weight="700" fill="#5b21b6">ЛЕГИЗМ</text>
      <text x="452" y="176" text-anchor="middle" font-size="9" fill="#78716c">закон (фа),</text>
      <text x="452" y="188" text-anchor="middle" font-size="9" fill="#78716c">награда</text>
      <text x="452" y="200" text-anchor="middle" font-size="9" fill="#78716c">и наказание</text>
      <text x="452" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Хань Фэй-цзы</text>

      <rect x="520" y="120" width="115" height="120" rx="8" fill="#fefce8" stroke="#eab308"/>
      <text x="577" y="140" text-anchor="middle" font-weight="700" fill="#854d0e">ШКОЛА</text>
      <text x="577" y="154" text-anchor="middle" font-weight="700" fill="#854d0e">ИМЁН</text>
      <text x="577" y="182" text-anchor="middle" font-size="9" fill="#78716c">точность</text>
      <text x="577" y="194" text-anchor="middle" font-size="9" fill="#78716c">понятий</text>
      <text x="577" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Гунсунь Лун</text>

      <rect x="645" y="120" width="115" height="120" rx="8" fill="#ecfeff" stroke="#06b6d4"/>
      <text x="702" y="140" text-anchor="middle" font-weight="700" fill="#155e75">ШКОЛА</text>
      <text x="702" y="154" text-anchor="middle" font-weight="700" fill="#155e75">ИНЬ-ЯН</text>
      <text x="702" y="182" text-anchor="middle" font-size="9" fill="#78716c">космология,</text>
      <text x="702" y="194" text-anchor="middle" font-size="9" fill="#78716c">пять стихий</text>
      <text x="702" y="224" text-anchor="middle" font-size="9" fill="#a8a29e">Цзоу Янь</text>
    </g>

    <line x1="390" y1="89" x2="77" y2="120" stroke="#fca5a5"/>
    <line x1="390" y1="89" x2="202" y2="120" stroke="#fca5a5"/>
    <line x1="390" y1="89" x2="327" y2="120" stroke="#fca5a5"/>
    <line x1="390" y1="89" x2="452" y2="120" stroke="#fca5a5"/>
    <line x1="390" y1="89" x2="577" y2="120" stroke="#fca5a5"/>
    <line x1="390" y1="89" x2="702" y2="120" stroke="#fca5a5"/>

    <rect x="20" y="258" width="740" height="36" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="390" y="281" text-anchor="middle" font-size="11" fill="#57534e">Итог: Цинь победила легизмом, Хань сделала доктриной конфуцианство — «снаружи конфуцианец, внутри легист»</text>
  </g>
</svg>
