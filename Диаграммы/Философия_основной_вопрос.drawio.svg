<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <rect width="760" height="400" fill="#f5f3ff" stroke="#e7e5e4"/>
  <text x="380" y="28" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-weight="700" fill="#292524">Основной вопрос философии и его две стороны</text>
  <g font-family="Source Sans 3, sans-serif" font-size="11">
    <rect x="215" y="45" width="330" height="46" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="380" y="65" text-anchor="middle" font-weight="700" fill="#5b21b6">Мышление ↔ Бытие</text>
    <text x="380" y="82" text-anchor="middle" fill="#78716c">основной вопрос философии</text>

    <rect x="60" y="120" width="290" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="205" y="137" text-anchor="middle" font-weight="700" fill="#92400e">Сторона 1 · онтологическая</text>
    <text x="205" y="152" text-anchor="middle" fill="#78716c">что первично?</text>

    <rect x="410" y="120" width="290" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="555" y="137" text-anchor="middle" font-weight="700" fill="#166534">Сторона 2 · гносеологическая</text>
    <text x="555" y="152" text-anchor="middle" fill="#78716c">познаваем ли мир?</text>

    <line x1="380" y1="91" x2="205" y2="120" stroke="#a78bfa"/>
    <line x1="380" y1="91" x2="555" y2="120" stroke="#a78bfa"/>

    <g fill="#ffffff">
      <rect x="60" y="180" width="90" height="70" rx="8" fill="#fef9c3" stroke="#eab308"/>
      <text x="105" y="200" text-anchor="middle" font-weight="700" fill="#854d0e">МАТЕРИА-</text>
      <text x="105" y="214" text-anchor="middle" font-weight="700" fill="#854d0e">ЛИЗМ</text>
      <text x="105" y="236" text-anchor="middle" font-size="9" fill="#78716c">первична</text>
      <text x="105" y="247" text-anchor="middle" font-size="9" fill="#78716c">материя</text>

      <rect x="160" y="180" width="90" height="70" rx="8" fill="#fee2e2" stroke="#ef4444"/>
      <text x="205" y="200" text-anchor="middle" font-weight="700" fill="#991b1b">ИДЕА-</text>
      <text x="205" y="214" text-anchor="middle" font-weight="700" fill="#991b1b">ЛИЗМ</text>
      <text x="205" y="236" text-anchor="middle" font-size="9" fill="#78716c">первична</text>
      <text x="205" y="247" text-anchor="middle" font-size="9" fill="#78716c">идея, дух</text>

      <rect x="260" y="180" width="90" height="70" rx="8" fill="#e0f2fe" stroke="#0ea5e9"/>
      <text x="305" y="200" text-anchor="middle" font-weight="700" fill="#075985">ДУА-</text>
      <text x="305" y="214" text-anchor="middle" font-weight="700" fill="#075985">ЛИЗМ</text>
      <text x="305" y="236" text-anchor="middle" font-size="9" fill="#78716c">два равно-</text>
      <text x="305" y="247" text-anchor="middle" font-size="9" fill="#78716c">правных начала</text>

      <rect x="410" y="180" width="70" height="70" rx="8" fill="#dcfce7" stroke="#22c55e"/>
      <text x="445" y="204" text-anchor="middle" font-weight="700" fill="#166534">ОПТИ-</text>
      <text x="445" y="218" text-anchor="middle" font-weight="700" fill="#166534">МИЗМ</text>
      <text x="445" y="240" text-anchor="middle" font-size="9" fill="#78716c">познаваем</text>

      <rect x="490" y="180" width="70" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="525" y="204" text-anchor="middle" font-weight="700" fill="#334155">СКЕПТИ-</text>
      <text x="525" y="218" text-anchor="middle" font-weight="700" fill="#334155">ЦИЗМ</text>
      <text x="525" y="240" text-anchor="middle" font-size="9" fill="#78716c">сомнение</text>

      <rect x="570" y="180" width="70" height="70" rx="8" fill="#fae8ff" stroke="#c026d3"/>
      <text x="605" y="204" text-anchor="middle" font-weight="700" fill="#86198f">АГНОС-</text>
      <text x="605" y="218" text-anchor="middle" font-weight="700" fill="#86198f">ТИЦИЗМ</text>
      <text x="605" y="240" text-anchor="middle" font-size="9" fill="#78716c">есть границы</text>

      <rect x="650" y="180" width="70" height="70" rx="8" fill="#ffedd5" stroke="#f97316"/>
      <text x="685" y="204" text-anchor="middle" font-weight="700" fill="#9a3412">ИРРА-</text>
      <text x="685" y="218" text-anchor="middle" font-weight="700" fill="#9a3412">ЦИОН.</text>
      <text x="685" y="240" text-anchor="middle" font-size="9" fill="#78716c">воля, интуиция</text>
    </g>

    <line x1="205" y1="160" x2="205" y2="180" stroke="#d6d3d1"/>
    <line x1="555" y1="160" x2="555" y2="180" stroke="#d6d3d1"/>

    <rect x="60" y="275" width="660" height="34" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="390" y="297" text-anchor="middle" font-size="11" fill="#57534e">Классическая формулировка (Гегель — Энгельс); часть направлений XX в. главным считают вопрос о смысле существования</text>

    <text x="380" y="345" text-anchor="middle" font-size="11" fill="#78716c">Порядок ответа: вопрос → сторона 1 (три позиции) → сторона 2 (четыре позиции) → оговорка</text>
  </g>
</svg>
