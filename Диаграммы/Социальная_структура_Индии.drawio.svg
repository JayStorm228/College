<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <rect width="700" height="360" fill="#fffbeb" stroke="#e7e5e4"/>
  <text x="350" y="28" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="18" font-weight="700" fill="#292524">Варновая структура Древней Индии</text>
  <g font-family="Source Sans 3, sans-serif" font-size="11" font-weight="600">
    <!-- Брахманы -->
    <rect x="100" y="55" width="500" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="350" y="75" text-anchor="middle" fill="#92400e">1. БРАХМАНЫ — жрецы, учителя · белый</text>
    <text x="350" y="92" text-anchor="middle" fill="#78716c" font-size="10">веды, ритуал, дхарма — учить</text>
    <!-- Кшатрии -->
    <rect x="110" y="115" width="480" height="50" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="350" y="135" text-anchor="middle" fill="#991b1b">2. КШАТРИИ — воины, правители · красный</text>
    <text x="350" y="152" text-anchor="middle" fill="#78716c" font-size="10">защита, управление</text>
    <!-- Вайшьи -->
    <rect x="130" y="175" width="440" height="50" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="350" y="195" text-anchor="middle" fill="#854d0e">3. ВАЙШЬИ — земледельцы, торговцы · жёлтый</text>
    <text x="350" y="212" text-anchor="middle" fill="#78716c" font-size="10">хозяйство, обмен</text>
    <!-- Шудры -->
    <rect x="150" y="235" width="400" height="50" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="350" y="255" text-anchor="middle" fill="#1f2937">4. ШУДРЫ — слуги · чёрный</text>
    <text x="350" y="272" text-anchor="middle" fill="#78716c" font-size="10">физический труд, служение</text>
  </g>
  <!-- Неприкасаемые -->
  <rect x="180" y="300" width="340" height="36" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="350" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280">НЕПРИКАСАЕМЫЕ (далиты) — вне варн, «нечистые» работы</text>
  <text x="350" y="332" text-anchor="middle" font-size="9" fill="#a8a29e">социальная изоляция, без доступа к ведическому ритуалу</text>
  <text x="610" y="58" font-size="9" fill="#a8a29e">4 варны</text>
  <line x1="600" y1="62" x2="600" y2="280" stroke="#d6d3d1" stroke-dasharray="3 3"/>
</svg>
