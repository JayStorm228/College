<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#fef7ed" stroke="#e7e5e4"/>
  <text x="400" y="30" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="20" font-weight="700" fill="#292524">Стадии становления и 8 кризисов</text>
  <!-- stages -->
  <g font-family="Source Sans 3, sans-serif" font-size="11" font-weight="600">
    <rect x="20" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="65" y="80" text-anchor="middle" fill="#292524">0–12</text><text x="65" y="95" text-anchor="middle" fill="#78716c">Аморфная</text>
    <rect x="115" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="160" y="80" text-anchor="middle" fill="#292524">12–17</text><text x="160" y="95" text-anchor="middle" fill="#78716c">Оптация</text>
    <rect x="210" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="255" y="80" text-anchor="middle" fill="#292524">15–23</text><text x="255" y="95" text-anchor="middle" fill="#78716c">Подготовка</text>
    <rect x="305" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="350" y="80" text-anchor="middle" fill="#292524">24–27</text><text x="350" y="95" text-anchor="middle" fill="#78716c">Адаптация</text>
    <rect x="400" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="445" y="80" text-anchor="middle" fill="#292524">→33</text><text x="445" y="95" text-anchor="middle" fill="#78716c">Первичная</text>
    <rect x="495" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="540" y="80" text-anchor="middle" fill="#292524">33–42</text><text x="540" y="95" text-anchor="middle" fill="#78716c">Вторичная</text>
    <rect x="590" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="635" y="80" text-anchor="middle" fill="#292524">60–65</text><text x="635" y="95" text-anchor="middle" fill="#78716c">Мастерство</text>
    <rect x="685" y="60" width="90" height="50" rx="6" fill="#fff" stroke="#b45309"/><text x="730" y="80" text-anchor="middle" fill="#292524">65+</text><text x="730" y="95" text-anchor="middle" fill="#78716c">Уход</text>
  </g>
  <!-- arrows -->
  <g stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow)">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
    <line x1="110" y1="85" x2="115" y2="85"/><line x1="205" y1="85" x2="210" y2="85"/><line x1="300" y1="85" x2="305" y2="85"/><line x1="395" y1="85" x2="400" y2="85"/><line x1="490" y1="85" x2="495" y2="85"/><line x1="585" y1="85" x2="590" y2="85"/><line x1="680" y1="85" x2="685" y2="85"/>
  </g>
  <!-- crises -->
  <g font-family="Source Sans 3, sans-serif" font-size="10">
    <rect x="115" y="140" width="90" height="35" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="160" y="155" text-anchor="middle" fill="#991b1b" font-weight="700">1 Ориентации</text><text x="160" y="168" text-anchor="middle" fill="#7c2d12">выбор</text>
    <rect x="210" y="140" width="90" height="35" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="255" y="155" text-anchor="middle" fill="#991b1b" font-weight="700">2 Ожиданий</text><text x="255" y="168" text-anchor="middle" fill="#7c2d12">разочарование</text>
    <rect x="305" y="140" width="90" height="35" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="350" y="155" text-anchor="middle" fill="#9a3412" font-weight="700">3 Адаптации</text><text x="350" y="168" text-anchor="middle" fill="#7c2d12">коллектив</text>
    <rect x="400" y="140" width="90" height="35" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="445" y="155" text-anchor="middle" fill="#9a3412" font-weight="700">4 Роста</text><text x="445" y="168" text-anchor="middle" fill="#7c2d12">потолок</text>
    <rect x="400" y="185" width="90" height="35" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="445" y="200" text-anchor="middle" fill="#9a3412" font-weight="700">5 Карьеры</text><text x="445" y="213" text-anchor="middle" fill="#7c2d12">стагнация</text>
    <rect x="495" y="140" width="90" height="35" rx="6" fill="#fef3c7" stroke="#fde68a"/><text x="540" y="155" text-anchor="middle" fill="#92400e" font-weight="700">6 Актуализации</text><text x="540" y="168" text-anchor="middle" fill="#78350f">смысл</text>
    <rect x="590" y="185" width="90" height="35" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="635" y="200" text-anchor="middle" fill="#374151" font-weight="700">7 Угасания</text><text x="635" y="213" text-anchor="middle" fill="#4b5563">предпенсия</text>
    <rect x="685" y="185" width="90" height="35" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="730" y="200" text-anchor="middle" fill="#374151" font-weight="700">8 Адекватн.</text><text x="730" y="213" text-anchor="middle" fill="#4b5563">идентичность</text>
  </g>
  <text x="400" y="250" text-anchor="middle" font-size="11" fill="#78716c" font-family="Source Sans 3, sans-serif">Каждый кризис — переход к следующей стадии. Диаграмма для лекции 03.</text>
  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#78716c">1–3 молодость/учёба · 4–6 зрелость · 7–8 поздняя зрелость</text>
</svg>
