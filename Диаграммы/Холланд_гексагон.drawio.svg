<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#fef7ed" stroke="#e7e5e4"/>
  <text x="300" y="30" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="22" font-weight="700" fill="#292524">Гексагон Холланда (RIASEC)</text>
  <!-- Hexagon -->
  <polygon points="300,80 430,155 430,305 300,380 170,305 170,155" fill="none" stroke="#b45309" stroke-width="3"/>
  <!-- Labels -->
  <g font-family="Source Sans 3, sans-serif" font-size="14" font-weight="700">
    <text x="300" y="70" text-anchor="middle" fill="#1e40af">R — Реалистический</text>
    <text x="460" y="155" text-anchor="start" fill="#1e40af">I — Исследовательский</text>
    <text x="460" y="315" text-anchor="start" fill="#92400e">A — Артистический</text>
    <text x="300" y="405" text-anchor="middle" fill="#166534">S — Социальный</text>
    <text x="140" y="315" text-anchor="end" fill="#92400e">E — Предприимчивый</text>
    <text x="140" y="155" text-anchor="end" fill="#57534e">C — Конвенциональный</text>
  </g>
  <g font-size="11" fill="#78716c" font-family="Source Sans 3, sans-serif" text-anchor="middle">
    <text x="300" y="460">Сплошные рёбра — соседство (высокая совместимость) · Пунктир — противоположности</text>
    <text x="300" y="475">R↔S, I↔E, A↔C — низкая конгруэнтность</text>
  </g>
  <!-- dashed opposite lines -->
  <line x1="300" y1="80" x2="300" y2="380" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="430" y1="155" x2="170" y2="305" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="430" y1="305" x2="170" y2="155" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
